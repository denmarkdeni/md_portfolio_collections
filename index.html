<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --ink: #EDE6D6;
    --ink-dim: #B9BFB6;
    --bg: #182620;
    --bg-deep: #121D18;
    --brass: #C4A05A;
    --rust: #9C5B44;
    --rule: rgba(237, 230, 214, 0.18);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
  }

  body{
    background: radial-gradient(circle at 15% 0%, var(--bg) 0%, var(--bg-deep) 70%);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .site-header{
    padding: 34px 6vw 26px;
    border-bottom: 1px solid var(--rule);
  }

  .site-header .title{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.3rem, 2.6vw, 1.6rem);
    letter-spacing: 0.01em;
  }

  main{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6vh 6vw;
  }

  .card{
    width:100%;
    max-width: 620px;
  }

  .masthead{
    margin-bottom: 4.5rem;
  }

  .masthead h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }

  .masthead .flourish{
    display:block;
    width: 92px;
    height: 14px;
    margin-top: 14px;
  }

  .masthead .flourish path{
    stroke: var(--brass);
    stroke-width: 2;
    fill:none;
    stroke-linecap: round;
  }

  .masthead p{
    margin-top: 18px;
    color: var(--ink-dim);
    font-size: 0.98rem;
    max-width: 40ch;
    line-height: 1.6;
  }

  .menu{
    list-style:none;
    border-top: 1px solid var(--rule);
  }

  .menu li{
    border-bottom: 1px solid var(--rule);
  }

  .menu a{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap: 20px;
    text-decoration:none;
    color: var(--ink);
    padding: 22px 2px;
    position:relative;
  }

  .menu .name{
    font-family:'Fraunces', serif;
    font-weight: 400;
    font-size: 1.3rem;
    transition: transform 0.35s cubic-bezier(.2,.7,.2,1), color 0.35s ease;
  }

  .menu .note{
    font-size: 0.82rem;
    color: var(--ink-dim);
    white-space:nowrap;
    flex-shrink:0;
    transition: color 0.35s ease;
  }

  .menu li::after{
    content:"";
    display:block;
    height:1px;
    background: var(--brass);
    width:0%;
    transition: width 0.4s cubic-bezier(.2,.7,.2,1);
  }

  .menu li:hover::after{
    width:100%;
  }

  .menu li:hover .name{
    transform: translateX(8px);
    color: var(--brass);
  }

  .menu li:hover .note{
    color: var(--rust);
  }

  .site-footer{
    padding: 22px 6vw 30px;
    border-top: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--ink-dim);
    display:flex;
    justify-content:space-between;
    gap: 20px;
    flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    .menu .name, .menu li::after{ transition:none; }
  }

  @media (max-width: 480px){
    .menu .note{ display:none; }
  }

</style>
</head>
<body>

  <header class="site-header">
    <span class="title">md portfolio collections</span>
  </header>

  <main>
    <div class="card">

      <div class="masthead">
        <h1>Maria Deniston</h1>
        <svg class="flourish" viewBox="0 0 92 14" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 8 C 20 -2, 30 16, 46 6 S 74 -2, 90 8" />
        </svg>
        <p>A collection of work across design, code, and image — sorted by discipline, not by date.</p>
      </div>

      <ul class="menu">
        <li><a href="./p1/index.html"><span class="name">Portfolio 1</span><span class="note">view</span></a></li>
        <li><a href="./p2/index.html"><span class="name">Portfolio 2</span><span class="note">view</span></a></li>
        <li><a href="./p3/index.html"><span class="name">Portfolio 3</span><span class="note">view</span></a></li>
        <li><a href="./p4/index.html"><span class="name">Portfolio 4</span><span class="note">view</span></a></li>
        <li><a href="./p5/index.html"><span class="name">Portfolio 5</span><span class="note">view</span></a></li>
        <li><a href="./p6/index.html"><span class="name">Portfolio 6</span><span class="note">view</span></a></li>
      </ul>

    </div>
  </main>

  <footer class="site-footer">
    <span>Chennai, India</span>
    <span>Updated 2026</span>
  </footer>

</body>
</html>
